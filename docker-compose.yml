services:
  postgresql:
    image: postgres:latest
    container_name: postgres_knowledge_base
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web_network

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    env_file:
      - .env
    ports:
      - "8001:80"
    depends_on:
      - postgresql
    networks:
      - web_network

  server:
    container_name: server_knowledge_base
    build: .
    command: python src/main.py
    ports:
      - 8000:8000
    depends_on:
      - postgresql
    volumes:
      - .:/app/server_knowledge_base
    networks:
      - web_network

  minio:
    image: minio/minio:latest
    container_name: minio_knowledge_base
    restart: unless-stopped
    ports:
      - "9000:9000" # API порт (для SDK и CLI)
      - "9001:9001" # Web-интерфейс (Console)
    env_file:
      - .env
    environment:
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001" # Запуск сервера + консоль
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - web_network

volumes:
  postgres_data:
  minio_data:


networks:
  web_network:
    driver: bridge
